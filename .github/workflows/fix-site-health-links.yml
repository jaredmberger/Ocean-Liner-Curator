smm.org/washington.html', None), ('https://oceanliners.net/ships/ss-zeeland', 'https://www.norwayheritage.com/p_ship.asp?sh=zeela', 'https://www.norwayheritage.com/'), ('https://oceanliners.net/this-day-in-ocean-liner-history', "https://oceanliners.net/'%20+%20escapeHTML(event.relatedUrl)%20+%20'", 'https://oceanliners.net/'), ('https://oceanliners.net/ships/ss-leviathan-timeline', 'https://www.history.navy.mil/', None)]
          changed=set(); failed=[]
          def vars(u): return list(dict.fromkeys([u,html.escape(u,quote=False)]))
          for page,old,new in rows:
            p=urlparse(page).path.strip('/')
            cs=[Path((p+'.html') if p else 'index.html'),Path(p)/'index.html' if p else Path('index.html')]
            cs=[x for x in cs if x.exists()]
            if not cs:
              cs=[x for x in Path('.').rglob('*.html') if page in x.read_text('utf-8',errors='ignore') and any(v in x.read_text('utf-8',errors='ignore') for v in vars(old))]
            nall=0
            for x in cs:
              s=x.read_text('utf-8'); orig=s; n=0
              for ov in vars(old):
                if new:
                  pat=re.compile(r'(?P<a>\\bhref\\s*=\\s*["\\\'])'+re.escape(ov)+r'(?P<b>["\\\'])',re.I)
                  s,k=pat.subn(lambda m:m.group('a')+new+m.group('b'),s)
                else:
                  pat=re.compile(r'<a\\b(?=[^>]*\\bhref\\s*=\\s*["\\\']'+re.escape(ov)+r'["\\\'])[^>]*>(.*?)</a\\s*>',re.I|re.S)
                  s,k=pat.subn(lambda m:m.group(1),s)
                n+=k
              if s!=orig:
                x.write_text(s,'utf-8'); changed.add(str(x)); nall+=n
            if nall==0 and 'this-day-in-ocean-liner-history' not in page: failed.append((page,old))
          sp=Path('this-day-in-ocean-liner-history.html')
          if sp.exists():
            s=sp.read_text('utf-8'); o=s
            s=s.replace("href=\"https://oceanliners.net/'%20+%20escapeHTML(event.relatedUrl)%20+%20'\"","href=\"' + escapeHTML(event.relatedUrl) + '\"")
            if s!=o: sp.write_text(s,'utf-8'); changed.add(str(sp))
          print('Changed',len(changed),'files')
          if failed:
            print('FAILED ROWS:',*failed,sep='\\n'); sys.exit(2)
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'ships/*.html' 2>/dev/null || true
          git commit -m "Fix broken links from 2026-08-03 site health report"
          git push
