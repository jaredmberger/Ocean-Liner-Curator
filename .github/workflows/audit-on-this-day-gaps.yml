name: Audit On This Day gaps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-on-this-day-gaps.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Audit calendar gaps
        run: node tools/search/audit-on-this-day-gaps.mjs
