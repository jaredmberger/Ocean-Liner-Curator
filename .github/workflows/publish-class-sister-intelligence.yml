name: Publish class and sister ship intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-class-sister-intelligence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/search/package-lock.json
      - name: Install search tooling
        run: npm ci --prefix tools/search
      - name: Generate class and sister intelligence
        run: node tools/search/class-sister-intelligence.mjs
      - name: Publish changed feed
        run: |
          if [ -z "$(git status --porcelain -- data/curatoros-classes-sisters.json)" ]; then
            echo 'Class and sister intelligence feed is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/curatoros-classes-sisters.json
          git commit -m 'Update CuratorOS class and sister intelligence feed'
          git push
