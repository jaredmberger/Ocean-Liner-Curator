name: Expand On This Day batch 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-on-this-day-batch4.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add curated exact-date events
        run: node tools/search/add-curated-on-this-day-batch4.mjs

      - name: Commit expanded calendar
        shell: bash
        run: |
          if git diff --quiet -- assets/this-day-ocean-liners.js; then
            echo "No calendar changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/this-day-ocean-liners.js
          git commit -m "Add fourth curated On This Day batch [skip ci]"
          git push
