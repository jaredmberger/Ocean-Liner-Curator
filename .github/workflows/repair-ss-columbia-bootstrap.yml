name: Bootstrap SS Columbia repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-ss-columbia-bootstrap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ss-columbia-duplicate-document
          fetch-depth: 0
      - name: Repair concatenated HTML document
        shell: python
        run: |
          from pathlib import Path
          path = Path('ships/ss-columbia.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="/assets/nav.js"<!DOCTYPE html>'
          if marker not in text:
              raise SystemExit('Expected corruption marker not found; refusing to modify file.')
          fixed = text.split(marker, 1)[0] + '<script src="/assets/nav.js" defer></script>\n  <script src="/assets/related-liners.js" defer></script>\n</body>\n</html>\n'
          path.write_text(fixed, encoding='utf-8')
      - name: Commit repaired page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships/ss-columbia.html
          git commit -m "Repair duplicated SS Columbia document"
          git push origin HEAD:fix/ss-columbia-duplicate-document
