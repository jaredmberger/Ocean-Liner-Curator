name: Historical Research Agent

on:
  schedule:
    # GitHub cron uses UTC; 12:17 UTC is 06:17 CST / 07:17 CDT.
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      guide_count:
        description: 'Number of short guides to investigate (1–5)'
        required: true
        default: '5'
        type: choice
        options: ['1', '2', '3', '4', '5']
      archive_to_r2:
        description: 'Archive research to private R2 (requires bucket and scoped credentials)'
        required: true
        default: false
        type: boolean
      import_to_curatoros:
        description: 'Opt in to CuratorOS evidence import (requires separately enabled protected API)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: historical-research-agent
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.pending.outputs.proceed }}
    steps:
      - name: Avoid duplicate research while a ledger PR awaits merge
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --paginate \
            --jq '[.[] | select(.head.ref | startswith("automation/historical-research-memory-"))] | length' | awk '{sum += $1} END {print sum+0}')
          if [ "$pending" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Research paused: an earlier ledger PR awaits merge." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  research:
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify API credential exists
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure repository secret OPENAI_API_KEY to enable research."
            exit 1
          fi
      - name: Produce research dossiers (read-only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_MODEL: gpt-5
          GUIDE_COUNT: ${{ github.event_name == 'schedule' && '5' || inputs.guide_count }}
        run: python3 scripts/historical-research-agent.py --count "$GUIDE_COUNT"
      - name: Build offline research review dashboard
        if: success()
        run: python3 scripts/build-research-review.py --input research-agent-output
      - name: Show report summary
        if: always()
        run: |
          if [ -f research-agent-output/README.md ]; then
            cat research-agent-output/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload dossiers for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-research-dossiers
          path: research-agent-output/
          if-no-files-found: ignore
          retention-days: 30

  propose-memory:
    name: Propose research ledger update
    needs: [research, archive-r2]
    if: ${{ always() && needs.research.result == 'success' && (needs.archive-r2.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.archive-r2.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: historical-research-dossiers
          path: research-agent-output
      - name: Prepare candidate ledger changes
        env:
          RESEARCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/propose-research-memory.py \
            --proposal research-agent-output/proposed-ledger-additions.json \
            --run-url "$RESEARCH_RUN_URL"
      - name: Create reviewable ledger-only PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s research-ledger-added.txt ]; then
            echo "No new investigation records; skipping pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/historical-research-memory-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add research/agent-ledger.json
          git commit -m "Record historical research run ${GITHUB_RUN_ID} for editorial review"
          git push --set-upstream origin "$branch"
          body=$(printf 'Research ledger proposal from [run %s](%s).\\n\\nInvestigation records only; historical claims and sources remain **unverified**. Merge only after inspecting the run dossiers. No ship guides were changed.\\n' "$GITHUB_RUN_ID" "$RESEARCH_RUN_URL")
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "Review Historical Research Agent memory from run ${GITHUB_RUN_ID}" \
            --body "$body")
          echo "Created $pr_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate ledger-only commit and automatically merge
        env:
          GH_TOKEN: ${{ github.token }}
          GUIDE_COUNT: ${{ github.event_name == 'schedule' && '5' || inputs.guide_count }}
        run: |
          if [ ! -s research-ledger-added.txt ]; then
            exit 0
          fi
          python3 scripts/validate-research-ledger-automerge.py \
            --run-id "$GITHUB_RUN_ID" --expected-count "$GUIDE_COUNT"
          pr_url=$(gh pr list --head "automation/historical-research-memory-${GITHUB_RUN_ID}" \
            --base main --state open --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            echo "::error::Expected ledger PR not found; refusing auto-merge"
            exit 1
          fi
          gh pr merge "$pr_url" --squash --delete-branch
          echo "Validated and automatically merged ledger-only PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

  archive-r2:
    name: Optional permanent private dossier archive
    needs: research
    if: ${{ needs.research.result == 'success' && (github.event_name == 'schedule' || inputs.archive_to_r2 == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: historical-research-dossiers
          path: research-agent-output
      - name: Install R2 S3 client
        run: python3 -m pip install 'boto3>=1.35,<2'
      - name: Archive unverified research privately
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_RESEARCH_BUCKET: ${{ vars.R2_RESEARCH_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEARCH_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/archive-research-to-r2.py --directory research-agent-output --run-id "$RESEARCH_RUN_ID"

  import-curatoros:
    name: Optional protected CuratorOS evidence intake
    needs: research
    if: ${{ needs.research.result == 'success' && inputs.import_to_curatoros == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: historical-research-dossiers
          path: research-agent-output
      - name: Import unverified evidence registers
        env:
          CURATOROS_RESEARCH_IMPORT_TOKEN: ${{ secrets.CURATOROS_RESEARCH_IMPORT_TOKEN }}
          CURATOROS_CF_ACCESS_CLIENT_ID: ${{ secrets.CURATOROS_CF_ACCESS_CLIENT_ID }}
          CURATOROS_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CURATOROS_CF_ACCESS_CLIENT_SECRET }}
          RESEARCH_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/import-research-to-curatoros.py --directory research-agent-output --run-id "$RESEARCH_RUN_ID"
