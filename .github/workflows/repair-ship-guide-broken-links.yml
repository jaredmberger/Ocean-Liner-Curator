avy.mil/research/histories/ship-histories/danfs/m/mount-vernon-iii.html"],["https://www.history.navy.mil/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-57000/NH-57750.html","https://web.archive.org/web/20251216135659/https://www.history.navy.mil/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-57000/NH-57750.html"]],"ships/ss-kroonland.html":[["https://www.redstarline.be/en/collection/ships","https://redstarline.be/"]],"ships/ss-lafayette.html":[["https://www.ggarchives.com/OceanTravel/SteamshipLines/FrenchLine.html","https://www.ggarchives.com/"]],"ships/ss-liberte.html":[["https://www.greatoceanliners.com/articles/europa/","https://www.greatoceanliners.com/"]],"ships/ss-lurline-1932.html":[["https://shippingtandy.com/features/matson-lines/","https://web.archive.org/web/20251214201240/https://shippingtandy.com/features/matson-lines/"]],"ships/ss-manchuria.html":[["https://www.history.navy.mil/research/histories/ship-histories/danfs/m/manchuria.html","https://web.archive.org/web/20251210115937/https://www.history.navy.mil/research/histories/ship-histories/danfs/m/manchuria.html"]],"ships/ss-minnewaska.html":[["https://www.theyard.info/ships/ships.asp?entryid=397","https://www.theyard.info/"]],"ships/ss-mongolia.html":[["https://www.history.navy.mil/research/histories/ship-histories/danfs/m/mongolia.html","https://web.archive.org/web/20250125121805/https://www.history.navy.mil/research/histories/ship-histories/danfs/m/mongolia.html"]],"ships/ss-morro-castle.html":[["https://shippingtandy.com/features/morro-castle-oriente/","https://web.archive.org/web/20260312051807/https://shippingtandy.com/features/morro-castle-oriente/"]],"ships/ss-nomadic.html":[["https://www.liverpoolmuseums.org.uk/collections/ss-nomadic","https://www.liverpoolmuseums.org.uk/"]],"ships/ss-oriana.html":[["https://www.norwayheritage.com/ships.asp","https://www.norwayheritage.com/"],["https://www.ggarchives.com/OceanTravel/SteamshipLines/PO.html","https://www.ggarchives.com/"]],"ships/ss-pasteur.html":[["https://simplonpc.co.uk/NGLBremen57.html","https://simplonpc.co.uk/"]],"ships/ss-patricia.html":[["https://www.history.navy.mil/research/histories/ship-histories/danfs/p/patricia.html","https://web.archive.org/web/20251209110005/https://www.history.navy.mil/research/histories/ship-histories/danfs/p/patricia.html"]],"ships/ss-pretoria.html":[["https://www.history.navy.mil/research/histories/ship-histories/danfs/p/pretoria.html","https://web.archive.org/web/20240525104247/https://www.history.navy.mil/research/histories/ship-histories/danfs/p/pretoria.html"]],"ships/ss-prinzess-irene.html":[["https://www.history.navy.mil/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-94000/NH-94205.html","https://web.archive.org/web/20251217141107/https://www.history.navy.mil/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-94000/NH-94205.html"]],"ships/ss-queen-of-bermuda.html":[["https://www.historicalrfa.org/requisitioned-auxiliary-queen-of-bermuda","https://www.historicalrfa.org/"],["https://shippingtandy.com/features/ocean-monarch/","https://web.archive.org/web/20260207210302/https://shippingtandy.com/features/ocean-monarch/"]],"ships/ss-resolute.html":[["https://en.wikipedia.org/wiki/SS_Resolute_(1914)","https://en.wikipedia.org/wiki/Main_Page"]],"ships/ss-rijndam-1901.html":[["https://www.history.navy.mil/content/history/nhhc/research/histories/ship-histories/danfs/r/rijndam.html","https://web.archive.org/web/20250120133157/https://www.history.navy.mil/content/history/nhhc/research/histories/ship-histories/danfs/r/rijndam.html"]],"ships/ss-vaterland.html":[["https://www.history.navy.mil/our-collections/photography/us-navy-ships/alphabetical-listing/l/uss-leviathan--id--1326--0.html","https://web.archive.org/web/20251209054751/https://www.history.navy.mil/our-collections/photography/us-navy-ships/alphabetical-listing/l/uss-leviathan--id--1326--0.html"]],"ships/ss-veendam.html":[["https://www.hollandamericablog.com/holland-america-lines-ss-veendam/","https://www.hollandamerica.com/blog/"]],"ships/ss-washington.html":[["https://www.history.navy.mil/research/histories/ship-histories/danfs/m/mount-vernon-iv.html","https://web.archive.org/web/20251209094950/https://www.history.navy.mil/research/histories/ship-histories/danfs/m/mount-vernon-iv.html"]],"ships/ss-westernland.html":[["https://uboat.net/allies/merchants/ship/xxxx.html","https://uboat.net/"],["https://en.wikipedia.org/wiki/SS_Westernland_(1918)","https://en.wikipedia.org/wiki/Main_Page"]],"ships/ss-zeeland.html":[["https://www.redstarline.be/en/ship/zeeland","https://redstarline.be/"]]}''')
          changed = []
          skipped = []

          for relative_path, pairs in replacements.items():
              path = Path(relative_path)
              if not path.exists():
                  skipped.append(f"missing file: {relative_path}")
                  continue

              original = path.read_text(encoding="utf-8")
              updated = original

              for old_url, new_url in pairs:
                  if old_url not in updated:
                      skipped.append(f"URL not found in {relative_path}: {old_url}")
                      continue
                  updated = updated.replace(old_url, new_url)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(relative_path)

          print("Changed files:")
          for item in changed:
              print(f"  {item}")

          if skipped:
              print("Skipped entries:")
              for item in skipped:
                  print(f"  {item}")

          if not changed:
              raise SystemExit("No ship-guide files were changed.")

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships/*.html
          git commit -m "Repair broken external links in ship guides"
          git push origin repair-ship-guide-broken-links
