name: Repair ship guide broken links

on:
  push:
    branches:
      - repair-ship-guide-broken-links
    paths:
      - .github/workflows/repair-ship-guide-broken-links.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-ship-guide-broken-links
          fetch-depth: 0

      - name: Replace audited broken URLs
        shell: python
        run: |
          import json
          from pathlib import Path

