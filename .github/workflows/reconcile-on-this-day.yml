name: Reconcile and expand On This Day

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-on-this-day.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile and expand calendar
        shell: bash
        run: node -e "eval(Buffer.from('','base64').toString())"

      - name: Commit calendar
        shell: bash
        run: |
          if git diff --quiet -- assets/this-day-ocean-liners.js; then
            echo "No calendar changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/this-day-ocean-liners.js
          git commit -m "Expand and normalize On This Day calendar [skip ci]"
          git push
