name: Reconcile archive source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-archive-source.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize archive source
        run: node tools/search/normalize-archive-source.mjs

      - name: Commit reconciled archive source
        shell: bash
        run: |
          if git diff --quiet -- ships/ships.html; then
            echo "ships/ships.html is already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships/ships.html
          git commit -m "Reconcile Ship Archive source [skip ci]"
          git push
