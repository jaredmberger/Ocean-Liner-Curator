name: Temporary site health link repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/broken-links-2026-08-03-v2
          fetch-depth: 0

      - name: Apply repair manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path

          manifest = Path('.maintenance/oceanliners-link-repair-manifest-2026-08-03.csv')
          failures = []
          applied = []
          skipped = []

          with manifest.open('r', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          seen = set()
          for row in rows:
              file_path = row['repo_file'].strip()
              action = row['action'].strip()
              old_url = row['old_url'].strip()
              new_url = row['new_url'].strip()
              spec = (file_path, action, old_url, new_url)
              if spec in seen:
                  continue
              seen.add(spec)

              if file_path == 'this-day-in-ocean-liner-history.html' and 'escapeHTML(event.relatedUrl)' in old_url:
                  skipped.append((file_path, old_url, 'scanner false positive: dynamic JS URL'))
                  continue

              path = Path(file_path)
              if not path.is_file():
                  failures.append((file_path, old_url, 'file not found'))
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              if action == 'replace':
                  if not new_url:
                      failures.append((file_path, old_url, 'replace action missing new_url'))
                      continue
                  pattern = re.compile(
                      r'(?P<prefix>\bhref\s*=\s*)(?P<q>[\"\'])' + re.escape(old_url) + r'(?P=q)',
                      re.IGNORECASE,
                  )
                  text, count = pattern.subn(
                      lambda m: m.group('prefix') + m.group('q') + new_url + m.group('q'),
                      text,
                  )
                  if count == 0:
                      failures.append((file_path, old_url, 'href not found for replacement'))
                      continue
                  applied.append((file_path, action, old_url, new_url, count))

              elif action == 'remove_link':
                  pattern = re.compile(
                      r'<a\b(?=[^>]*\bhref\s*=\s*(?P<q>[\"\'])' + re.escape(old_url) + r'(?P=q))[^>]*>(?P<body>.*?)</a\s*>',
                      re.IGNORECASE | re.DOTALL,
                  )
                  text, count = pattern.subn(lambda m: m.group('body'), text)
                  if count == 0:
                      failures.append((file_path, old_url, 'anchor not found for unlink'))
                      continue
                  applied.append((file_path, action, old_url, '', count))
              else:
                  failures.append((file_path, old_url, f'unknown action: {action}'))
                  continue

              if text != original:
                  path.write_text(text, encoding='utf-8')

          print(f'Applied repair specifications: {len(applied)}')
          for item in applied:
              print('APPLIED', *item, sep='\t')
          for item in skipped:
              print('SKIPPED', *item, sep='\t')

          if failures:
              print('\nFAILED REPAIR SPECIFICATIONS:')
              for item in failures:
                  print('FAILED', *item, sep='\t')
              raise SystemExit(f'{len(failures)} repair specifications could not be applied')
          PY

      - name: Verify targeted dead URLs are gone
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          failures = []
          with Path('.maintenance/oceanliners-link-repair-manifest-2026-08-03.csv').open('r', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          for row in rows:
              file_path = row['repo_file'].strip()
              old_url = row['old_url'].strip()
              if file_path == 'this-day-in-ocean-liner-history.html' and 'escapeHTML(event.relatedUrl)' in old_url:
                  continue
              path = Path(file_path)
              if path.is_file() and old_url in path.read_text(encoding='utf-8'):
                  failures.append((file_path, old_url))

          if failures:
              for item in failures:
                  print('OLD URL REMAINS', *item, sep='\t')
              raise SystemExit(f'{len(failures)} targeted old URLs remain')
          print('Verification passed: all targeted real dead URLs are absent.')
          PY

          git diff --check
          git status --short

      - name: Commit and push repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes were produced."
            exit 1
          fi
          git commit -m "Repair broken external links from site health report"
          git push origin HEAD:fix/broken-links-2026-08-03-v2
