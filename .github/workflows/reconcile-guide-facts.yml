name: Reconcile guide facts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-guide-facts.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install search dependencies
        working-directory: tools/search
        run: npm ci

      - name: Reconcile guide facts into source
        run: node tools/search/normalize-guide-facts.mjs

      - name: Commit reconciled guide sources
        shell: bash
        run: |
          if git diff --quiet -- ships; then
            echo "Guide source facts are already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships
          git commit -m "Reconcile structured guide facts into source [skip ci]"
          git push
