name: Fix On This Day schema typo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-on-this-day-schema.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix schema typo
        run: |
          node -e "const fs=require('fs'); const p='assets/this-day-ocean-liners.js'; let s=fs.readFileSync(p,'utf8'); const before=(s.match(/whyItRatters/g)||[]).length; s=s.replace(/whyItRatters/g,'whyItMatters'); fs.writeFileSync(p,s); console.log('fixed',before,'occurrence(s)');"
      - name: Commit fix
        run: |
          if git diff --quiet -- assets/this-day-ocean-liners.js; then
            echo "No typo present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/this-day-ocean-liners.js
          git commit -m "Fix On This Day schema field typo [skip ci]"
          git push
