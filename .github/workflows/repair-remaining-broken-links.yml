name: Repair remaining broken links

on:
  push:
    branches:
      - repair-remaining-broken-links

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair-remaining-broken-links
          fetch-depth: 0

      - name: Replace only audited broken URLs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "sources.html": [
                  ("https://www.gov.uk/government/collections/merchant-shipping-inquiries", "https://www.gov.uk/"),
                  ("https://libguides.liverpool.ac.uk/cunardarchive", "https://libguides.liverpool.ac.uk/"),
                  ("https://www.nationalarchives.gov.uk/help-with-your-research/research-guides/merchant-seamen/", "https://www.nationalarchives.gov.uk/"),
                  ("https://www.encyclopedia-titanica.org/community/members/charles-haas.21/", "https://www.encyclopedia-titanica.org/"),
                  ("https://www.rmg.co.uk/stories/topics/exhibitions", "https://www.rmg.co.uk/"),
                  ("https://www.encyclopedia-titanica.org/community/members/bill-wormstedt.35/", "https://www.encyclopedia-titanica.org/"),
                  ("https://www.christies.com/", "https://web.archive.org/web/20260721064136/https://www.christies.com/"),
              ],
              "lusitania-sinking-timeline.html": [
                  ("https://www.iwm.org.uk/history/why-was-the-sinking-of-the-lusitania-important", "https://www.iwm.org.uk/"),
                  ("https://www.archives.gov/publications/prologue/2015/spring/lusitania.html", "https://www.archives.gov/"),
              ],
              "ships/ss-belgravia.html": [
                  ("https://www.history.navy.mil/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-89000/NH-89913.html", "https://web.archive.org/web/20251216092441/https://www.history.navy.mil/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-89000/NH-89913.html"),
              ],
              "ships/ss-calgarian.html": [
                  ("https://www.norwayheritage.com/p_ship.asp?sh=calg1", "https://web.archive.org/web/20260420130641/https://www.norwayheritage.com/p_ship.asp?sh=calg1"),
              ],
              "ships/ss-calgaric.html": [
                  ("https://www.norwayheritage.com/p_ship.asp?sh=calga", "https://web.archive.org/web/20250715211248/https://www.norwayheritage.com/p_ship.asp?sh=calga"),
              ],
              "ships/ss-cleveland.html": [
                  ("https://www.norwayheritage.com/p_ship.asp?sh=cleve", "https://web.archive.org/web/20250819190554/https://www.norwayheritage.com/p_ship.asp?sh=cleve"),
              ],
              "ships/ss-commonwealth.html": [
                  ("https://www.norwayheritage.com/p_ship.asp?sh=commo", "https://web.archive.org/web/20251029221511/https://www.norwayheritage.com/p_ship.asp?sh=commo"),
                  ("https://www.norwayheritage.com/p_ship.asp?sh=canop", "https://web.archive.org/web/20251118223541/https://www.norwayheritage.com/p_ship.asp?sh=canop"),
              ],
              "ships/ss-moltke.html": [
                  ("https://www.history.navy.mil/content/history/nhhc/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-45000/NH-45526.html", "https://web.archive.org/web/20251230024717/https://www.history.navy.mil/content/history/nhhc/our-collections/photography/numerical-list-of-images/nhhc-series/nh-series/NH-45000/NH-45526.html"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f"Expected file not found: {filename}")
              original = path.read_text(encoding="utf-8")
              updated = original
              for old, new in pairs:
                  count = updated.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence in {filename}, found {count}: {old}")
                  updated = updated.replace(old, new, 1)
              if updated == original:
                  raise SystemExit(f"No changes made to {filename}")
              path.write_text(updated, encoding="utf-8")

      - name: Remove temporary workflow and commit repairs
        run: |
          git rm .github/workflows/repair-remaining-broken-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.html lusitania-sinking-timeline.html ships/ss-belgravia.html ships/ss-calgarian.html ships/ss-calgaric.html ships/ss-cleveland.html ships/ss-commonwealth.html ships/ss-moltke.html
          git commit -m "Repair remaining broken external links"
          git push origin HEAD:repair-remaining-broken-links
