name: Enrich priority ship guides

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-priority-ship-guides.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich five priority guides
        run: |
          node <<'NODE'
          const fs = require('fs');

          const edits = {
            'ships/ss-traffic.html': {
              marker: '      <span class="mini-badge">Evidence-first ship guide</span>',
              section: `
      <h2>Operational Role at Cherbourg</h2>
      <p><em>Traffic</em> is best understood not as a miniature ocean liner, but as part of the shore-to-ship machinery that made White Star’s largest liners practical at Cherbourg. Built alongside <a href="/ships/ss-nomadic"><em>Nomadic</em></a>, she handled third-class passengers as well as baggage, mail, and cargo while <em>Nomadic</em> principally carried first- and second-class passengers. The arrangement separated passenger streams and accelerated transfer between the railway-connected port and liners waiting in deeper water.</p>
      <p>That function placed <em>Traffic</em> directly inside the operating history of <a href="/ships/rms-olympic"><em>Olympic</em></a> and <a href="/ships/rms-titanic"><em>Titanic</em></a>. On 10 April 1912, both Cherbourg tenders participated in transferring passengers to <em>Titanic</em> during her maiden voyage. The tender system is therefore important evidence for how giant liners actually interacted with ports that could not berth them directly.</p>

      <h2>Later Career and Significance</h2>
      <p>During the First World War, <em>Traffic</em> was used in troop-transport work before returning to tender service. White Star later sold the Cherbourg tenders in the late 1920s as ownership and operating arrangements changed. Unlike <em>Nomadic</em>, <em>Traffic</em> did not survive into preservation, which makes photographs, plans, and contemporary documentation especially important to reconstructing the paired tender system.</p>
      <p>Her significance lies less in glamour than in logistics. The great express liners depended on vessels such as <em>Traffic</em> to connect ship, port, railway, baggage handling, and passenger classes into one functioning transport network.</p>

`,
              sources: [
                ['https://www.titanicbelfast.com/history-of-titanic/ship-fact-files/nomadic-ii-fact-file/','Titanic Belfast — Nomadic (II) Fact File (includes Traffic and Cherbourg tender system)'],
                ['https://www.titanicbelfast.com/history-of-titanic/on-this-day/10th-april-1912-1/','Titanic Belfast — Titanic at Cherbourg, 10 April 1912'],
                ['https://www.whitestarhistory.com/traffic2','White Star History — SS Traffic (II) (specialist secondary history)']
              ]
            },
            'ships/ss-nomadic.html': {
              marker: '      <span class="mini-badge">Evidence-first ship guide</span>',
              section: `
      <h2>Beyond the Titanic Connection</h2>
      <p><em>Nomadic</em> is often introduced through her association with <a href="/ships/rms-titanic"><em>Titanic</em></a>, but her working life was much longer than that single evening in April 1912. She spent decades tendering major liners at Cherbourg, served in both world wars, and remained in passenger-transfer work until the decline of traditional transatlantic liner traffic made the role increasingly obsolete.</p>
      <p>After retirement from tender service in 1968, the vessel survived through an unusual second life in Paris as a floating restaurant and entertainment venue. That survival proved decisive: instead of being lost with most White Star service craft, she remained physically intact long enough to be returned to Belfast, restored, and interpreted as a historic vessel.</p>

      <h2>Why Nomadic Matters</h2>
      <p><em>Nomadic</em> is the last surviving White Star Line vessel and an unusually direct material link to the company’s operating world. Her value is not simply that she once served <em>Titanic</em>; her structure, machinery, class-separated passenger spaces, and tender role preserve evidence of the broader transport system built around the Olympic-class liners.</p>
      <p>Her preservation also changes the evidentiary landscape. Researchers are able to compare photographs, plans, fittings, spatial arrangements, and restoration decisions against a surviving hull rather than relying only on documents. That makes <em>Nomadic</em> both a ship and a reference object for studying White Star practice at Cherbourg.</p>

`,
              sources: [
                ['https://www.nationalhistoricships.org.uk/register/2053/ss-nomadic','National Historic Ships UK — SS Nomadic register entry'],
                ['https://www.titanicbelfast.com/explore/ss-nomadic/the-nomadic-experience/','Titanic Belfast — The Nomadic Experience']
              ]
            },
            'ships/rms-lucania.html': {
              marker: '      <span class="mini-badge">Evidence-first ship guide</span>',
              section: `
<h2>Express-Liner Technology at Its Peak</h2>
<p><em>Lucania</em> and <a href="/ships/rms-campania"><em>Campania</em></a> were conceived as a matched Cunard express pair at the high point of large reciprocating-engine liner development. Their twin screws, powerful five-cylinder triple-expansion engines, and large passenger capacity embodied a mature version of the technology that had transformed North Atlantic travel during the nineteenth century.</p>
<p>Speed was central to their public identity. <em>Lucania</em> took transatlantic record honors during the 1890s and became one of the ships against which the next generation of German express liners was measured. Her importance is therefore not only that she was fast, but that she represents the last major Cunard speed generation before turbine propulsion changed the engineering basis of the competition.</p>

<h2>Wireless and the Changing Passenger Experience</h2>
<p>In 1901 <em>Lucania</em> became the first Cunard liner fitted with Marconi wireless equipment. Wireless did more than improve ship-to-shore communication: it began to erode the isolation that had traditionally defined an Atlantic passage, allowing news and operational information to reach a liner while she was still at sea.</p>
<p>Her destruction by fire at Liverpool in 1909 brought a comparatively abrupt end to a career that had begun only sixteen years earlier. By then, however, the technological world she represented was already being overtaken by turbine-driven liners such as <a href="/ships/rms-lusitania"><em>Lusitania</em></a> and <a href="/ships/rms-mauretania"><em>Mauretania</em></a>.</p>

`,
              sources: [
                ['https://www.ggarchives.com/OT/Brochures/CunardLine-1893-PassengersLogBook.html','GG Archives — Cunard Passenger’s Log Book, 1893 (period material on Campania and Lucania)'],
                ['https://www.ggarchives.com/OT/Ships/Campania.html','GG Archives — Campania archival collection (sister-ship context)']
              ]
            },
            'ships/ss-city-of-new-york-1888.html': {
              marker: '      <span class="mini-badge">Evidence-first ship guide</span>',
              section: `
      <h2>Twin Screws and a New Express-Liner Pattern</h2>
      <p><em>City of New York</em> and her running mate <a href="/ships/ss-city-of-paris"><em>City of Paris</em></a> belonged to an important transitional generation. Their twin-screw machinery provided both performance and redundancy at a time when the most powerful single-screw liners remained vulnerable to a single shaft or propeller failure. Combined with steel construction and extensive subdivision, the design pointed toward features that would become increasingly normal in large express liners.</p>
      <p>The ship’s scale and appointments also reflected Inman Line’s attempt to compete at the prestige end of the North Atlantic market. She was not simply a faster packet steamer; she belonged to the emerging idea of the ocean liner as a large, technologically sophisticated passenger environment whose machinery, public rooms, and corporate identity were all part of the product.</p>

      <h2>An Identity That Followed Ownership</h2>
      <p>The vessel’s later names make her a particularly useful case study in the international business of shipping. After entering American Line service she became <em>New York</em>, and during wartime service she carried U.S. naval identities including USS <em>Harvard</em> and USS <em>Plattsburg</em>. Those changes were not cosmetic: each name belongs to a different operational and political context.</p>
      <p>For that reason, surviving photographs, passenger material, and naval records should be dated before attribution. The same hull can appear in sources under several identities, and treating them as interchangeable obscures the corporate and wartime transitions that make the ship historically valuable.</p>

`,
              sources: [
                ['https://www.ggarchives.com/OT/FleetLists/InmanLine.html','GG Archives — Inman Line fleet list and City of New York summary']
              ]
            },
            'ships/ss-rotterdam-1908.html': {
              marker: '      <span class="mini-badge">Evidence-first ship guide</span>',
              section: `
      <h2>Flagship of a Growing Holland America Line</h2>
      <p>When <em>Rotterdam</em> entered service in 1908, Holland America Line presented her as its flagship. The company’s own historical timeline identifies her as the first transatlantic ship fitted with a glass-enclosed promenade, an amenity that illustrates how liner design was increasingly shaped around passenger comfort as well as transportation.</p>
      <p>She also represented a more visible corporate confidence. Holland America’s historical account describes the fourth <em>Rotterdam</em> as the company’s first two-funnel ship, giving the vessel a stronger express-liner profile even though the line’s identity rested more on dependable service than on competing directly for absolute speed records.</p>

      <h2>From Crossing to Cruising</h2>
      <p><em>Rotterdam</em> remained useful because her career adapted as the passenger business changed. Holland America records that she served as a troop carrier around the end of the First World War and later made regular Mediterranean cruises from New York. That transition is historically significant: it shows an established North Atlantic liner being used not only as point-to-point transportation but increasingly as the destination and experience itself.</p>
      <p>Seen in that context, the 1908 <em>Rotterdam</em> belongs to the longer history of the liner-to-cruise transition. Her career connects the mass migration and scheduled-service world of the early twentieth century with the growing leisure-cruise market of the interwar years.</p>

`,
              sources: [
                ['https://www.hollandamerica.com/150th-anniversary/en/timeline/','Holland America Line — 150th Anniversary historical timeline'],
                ['https://www.hollandamerica.com/blog/whats-new/past-holland-america-rotterdam-cruise-ships/','Holland America Line — Through the Years: Seven Rotterdam Ships'],
                ['https://stadsarchief.rotterdam.nl/holland-amerika-lijn','Stadsarchief Rotterdam — Holland Amerika Lijn history']
              ]
            }
          };

          for (const [file, edit] of Object.entries(edits)) {
            let html = fs.readFileSync(file, 'utf8');
            if (!html.includes(edit.marker)) throw new Error(`Marker missing in ${file}`);
            if (!html.includes(edit.section.trim().slice(0,40))) {
              html = html.replace(edit.marker, edit.section + edit.marker);
            }

            const ulMarker = '<ul class="sources">';
            if (!html.includes(ulMarker)) throw new Error(`Sources list missing in ${file}`);
            const additions = edit.sources
              .filter(([url]) => !html.includes(`href="${url}"`))
              .map(([url,label]) => `\n        <li><a href="${url}" target="_blank" rel="noopener">${label}</a></li>`)
              .join('');
            if (additions) html = html.replace(ulMarker, ulMarker + additions);
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Validate enriched guides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const checks = {
            'ships/ss-traffic.html':['Operational Role at Cherbourg','Later Career and Significance','titanicbelfast.com/history-of-titanic/on-this-day/10th-april-1912-1/'],
            'ships/ss-nomadic.html':['Beyond the Titanic Connection','Why Nomadic Matters','nationalhistoricships.org.uk/register/2053/ss-nomadic'],
            'ships/rms-lucania.html':['Express-Liner Technology at Its Peak','Wireless and the Changing Passenger Experience','CunardLine-1893-PassengersLogBook'],
            'ships/ss-city-of-new-york-1888.html':['Twin Screws and a New Express-Liner Pattern','An Identity That Followed Ownership','OT/FleetLists/InmanLine.html'],
            'ships/ss-rotterdam-1908.html':['Flagship of a Growing Holland America Line','From Crossing to Cruising','150th-anniversary/en/timeline/']
          };
          for (const [file, needles] of Object.entries(checks)) {
            const html = fs.readFileSync(file,'utf8');
            for (const needle of needles) if (!html.includes(needle)) throw new Error(`${file} missing ${needle}`);
          }
          console.log('Validated five enriched ship guides.');
          NODE

      - name: Commit enrichment and remove workflow
        run: |
          git rm -f .github/workflows/enrich-priority-ship-guides.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ships/ss-traffic.html ships/ss-nomadic.html ships/rms-lucania.html ships/ss-city-of-new-york-1888.html ships/ss-rotterdam-1908.html
          git commit -m 'Enrich priority ship guides [skip ci]'
          git push
