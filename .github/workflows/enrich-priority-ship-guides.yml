name: Enrich priority ship guides

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-priority-ship-guides.yml'
      - 'tools/search/enrich-priority-guides.mjs'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enrich five priority guides
        run: node tools/search/enrich-priority-guides.mjs
      - name: Commit enrichment and clean temporary files
        run: |
          git rm -f .github/workflows/enrich-priority-ship-guides.yml tools/search/enrich-priority-guides.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ships/ss-traffic.html ships/ss-nomadic.html ships/rms-lucania.html ships/ss-city-of-new-york-1888.html ships/ss-rotterdam-1908.html
          git commit -m 'Enrich priority ship guides [skip ci]'
          git push
