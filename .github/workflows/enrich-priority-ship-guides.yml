name: Enrich priority ship guides

on:
  push:
    paths:
      - '.github/workflows/enrich-priority-ship-guides.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich five priority guides
        run: node tools/search/enrich-priority-guides.mjs

      - name: Validate enriched guides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'ships/ss-nomadic.html',
            'ships/ss-traffic.html',
            'ships/rms-lucania.html',
            'ships/ss-city-of-new-york-1888.html',
            'ships/ss-rotterdam-1908.html'
          ];
          function visibleText(html) {
            return html.replace(/<head[\s\S]*?<\/head>/gi,' ').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
          }
          for (const file of files) {
            const html = fs.readFileSync(file,'utf8');
            const words = visibleText(html).split(/\s+/).filter(Boolean).length;
            const sourceStart = html.indexOf('<h2>Sources (Selected)</h2>');
            const sources = (html.slice(sourceStart).match(/<a\b[^>]*href=/gi) || []).length;
            const facts = (html.match(/\bfact-row\b/g) || []).length;
            const shipLinks = (html.match(/href=["']\/ships\//gi) || []).length;
            if (words < 700) throw new Error(`${file} remains too thin: ${words} words`);
            if (sources < 3) throw new Error(`${file} remains under-sourced: ${sources} links`);
            console.log(JSON.stringify({file,words,sources,facts,shipLinks}));
          }
          if (/Entered Service<\/div>\s*<div class="fact-value">1894/i.test(fs.readFileSync('ships/rms-lucania.html','utf8'))) throw new Error('Lucania 1894 service error survived');
          if (/Westbound record, 1892/i.test(fs.readFileSync('ships/ss-city-of-new-york-1888.html','utf8'))) throw new Error('City of New York record direction error survived');
          if (/29 July 1908/i.test(fs.readFileSync('ships/ss-rotterdam-1908.html','utf8'))) throw new Error('Rotterdam launch-date error survived');
          if (/collision; commonly cited date/i.test(fs.readFileSync('ships/ss-traffic.html','utf8'))) throw new Error('Traffic fate error survived');
          NODE

      - name: Commit enriched guides and clean up
        run: |
          git rm -f .github/workflows/enrich-priority-ship-guides.yml tools/search/enrich-priority-guides.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ships/ss-nomadic.html ships/ss-traffic.html ships/rms-lucania.html ships/ss-city-of-new-york-1888.html ships/ss-rotterdam-1908.html
          git commit -m 'Enrich first priority ship guide batch [skip ci]'
          git push
