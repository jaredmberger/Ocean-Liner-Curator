name: Enrich priority ship guides

on:
  push:
    paths:
      - '.github/workflows/enrich-priority-ship-guides.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich five priority guides
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceRange(file, startMarker, endMarker, replacement) {
            let s = fs.readFileSync(file, 'utf8');
            const a = s.indexOf(startMarker);
            if (a < 0) throw new Error(`Missing start marker in ${file}: ${startMarker}`);
            const b = s.indexOf(endMarker, a);
            if (b < 0) throw new Error(`Missing end marker in ${file}: ${endMarker}`);
            s = s.slice(0, a) + replacement + '\n\n      ' + s.slice(b);
            fs.writeFileSync(file, s);
          }

          function replaceSources(file, replacement) {
            let s = fs.readFileSync(file, 'utf8');
            const a = s.indexOf('<h2>Sources (Selected)</h2>');
            if (a < 0) throw new Error(`Missing sources heading in ${file}`);
            const ulEnd = s.indexOf('</ul>', a);
            if (ulEnd < 0) throw new Error(`Missing sources list end in ${file}`);
            s = s.slice(0, a) + replacement + s.slice(ulEnd + 5);
            fs.writeFileSync(file, s);
          }

          replaceRange(
            'ships/ss-nomadic.html',
            '<h2>Overview</h2>',
            '<span class="mini-badge">Evidence-first ship guide</span>',
`<h2>Overview</h2>
      <p>
        SS <em>Nomadic</em> was a purpose-built White Star Line tender designed for Cherbourg, where the largest transatlantic liners could not berth directly alongside the passenger facilities. Built by Harland &amp; Wolff at Belfast as yard number 422, she formed part of the shore-to-ship infrastructure created for White Star’s new Olympic-class service.
      </p>
      <p>
        Her role was deliberately distinct from that of <a href="/ships/ss-traffic">SS <em>Traffic</em></a>. <em>Nomadic</em> handled first- and second-class passengers, while <em>Traffic</em> concentrated on third-class passengers, baggage, mail, and cargo. The pair therefore extended the class structure and operational choreography of the great liners into the harbor itself.
      </p>
      <p class="note">
        Today <em>Nomadic</em> is especially important because she survives: Titanic Belfast identifies her as the last remaining White Star Line vessel, preserved in Belfast after a working life that continued long after her original tender service.
      </p>

      <h2>Key Facts</h2>
      <div class="facts" role="table" aria-label="Key facts table">
        <div class="fact-row"><div class="fact-label">Owner / Operator (as built)</div><div class="fact-value">Oceanic Steam Navigation Co. Ltd. (White Star Line)</div></div>
        <div class="fact-row"><div class="fact-label">Builder</div><div class="fact-value">Harland &amp; Wolff Ltd., Queen’s Island, Belfast</div></div>
        <div class="fact-row"><div class="fact-label">Yard Number</div><div class="fact-value">422</div></div>
        <div class="fact-row"><div class="fact-label">Laid Down</div><div class="fact-value">22 December 1910</div></div>
        <div class="fact-row"><div class="fact-label">Launched</div><div class="fact-value">25 April 1911</div></div>
        <div class="fact-row"><div class="fact-label">Handed Over</div><div class="fact-value">27 May 1911</div></div>
        <div class="fact-row"><div class="fact-label">Type</div><div class="fact-value">Passenger and baggage tender</div></div>
        <div class="fact-row"><div class="fact-label">Intended Station</div><div class="fact-value">Cherbourg, France</div></div>
        <div class="fact-row"><div class="fact-label">Length</div><div class="fact-value">220.7 ft</div></div>
        <div class="fact-row"><div class="fact-label">Gross Registered Tonnage</div><div class="fact-value">1,260.22 GRT</div></div>
        <div class="fact-row"><div class="fact-label">Propulsion</div><div class="fact-value">Twin-screw; two reciprocating engines</div></div>
        <div class="fact-row"><div class="fact-label">Speed</div><div class="fact-value">10 knots</div></div>
        <div class="fact-row"><div class="fact-label">Preservation</div><div class="fact-value">Restored and preserved at Hamilton Dock, Belfast</div></div>
      </div>

      <h2>Designed as Part of a Liner System</h2>
      <p>
        <em>Nomadic</em> makes the most sense when viewed not as a miniature ocean liner but as a purpose-built component of an integrated transport system. Titanic Belfast’s ship file emphasizes that White Star’s Olympic-class project required more than new ships: ports, docks, passenger facilities, hotels, rail connections, and transfer craft all had to function together. Cherbourg’s harbor could not receive the giant liners directly, so the tender became an essential link rather than an incidental service boat.
      </p>
      <p>
        White Star could have relied on converted local craft, as other companies often did. Instead it commissioned dedicated tenders whose accommodation and handling arrangements reflected the service standards of the liners they met. That decision is historically revealing. It shows the company treating the passenger journey as an end-to-end experience, with the transfer from train and terminal to ship engineered as deliberately as the public rooms aboard the liner itself.
      </p>

      <h2>Titanic and the Cherbourg Transfer</h2>
      <p>
        <em>Nomadic</em>’s best-known assignment came in April 1912, when she carried first- and second-class passengers from Cherbourg out to <em>Titanic</em>. The association is important, but it should not reduce the tender to a single evening. She had been built for a recurring operational task and served generations of major liners calling at Cherbourg.
      </p>
      <p>
        That broader context is useful for interpretation. The tender demonstrates how the scale of the newest express liners changed the infrastructure around them: the ship offshore, the tender alongside, baggage and passengers divided by function, and shore-side railway connections timed to the sailing. The celebrated liner was only the most visible part of a much larger machine.
      </p>

      <h2>A Long Working Life</h2>
      <p>
        <em>Nomadic</em> remained useful because a tender was fundamentally a working vessel rather than a prestige object. Her career extended through both world wars and through changes of ownership and use. Titanic Belfast notes that she later spent nearly three decades in Paris as a restaurant and entertainment venue, an extraordinary second life for a vessel designed to shuttle passengers across a harbor.
      </p>
      <p>
        Her eventual return to Belfast transformed her significance again. Restoration work brought the vessel back into the physical setting of the shipyard that built her, and the restored ship and Hamilton Dock opened to visitors in 2013. In 2015 ownership passed to Maritime Belfast Trust, integrating <em>Nomadic</em> into the broader preservation and interpretation of Belfast’s maritime-industrial heritage.
      </p>

      <h2>Why Nomadic Matters</h2>
      <p>
        <em>Nomadic</em> survives where nearly every major White Star liner does not. That makes her valuable not simply as a memorial to <em>Titanic</em>, but as physical evidence of White Star design, Harland &amp; Wolff workmanship, passenger-class organization, and the practical infrastructure of early twentieth-century liner travel.
      </p>
      <p>
        Her scale is part of the lesson. Ocean-liner history can become dominated by record holders and flagships, yet vessels such as <em>Nomadic</em> reveal how those flagships actually functioned. A transatlantic liner network depended on dozens of less glamorous systems and craft; here, unusually, one of those working components survives intact enough to be studied directly.
      </p>

      <h2>Collecting &amp; Attribution Notes</h2>
      <p>
        Objects claimed as “from <em>Nomadic</em>” should be distinguished from generic White Star material and from objects merely associated with Cherbourg. Strong attribution rests on vessel-specific documentation, dated photographs, yard records, institutional provenance, or a traceable chain of custody. White Star branding alone is not evidence that an item came from this tender.
      </p>`
          );

          replaceSources('ships/ss-nomadic.html', `<h2>Sources (Selected)</h2>
      <ul class="sources">
        <li><a href="/sources">Ocean Liner Curator — Sources (master bibliography)</a></li>
        <li><a href="https://www.titanicbelfast.com/history-of-titanic/ship-fact-files/nomadic-ii-fact-file/" target="_blank" rel="noopener">Titanic Belfast — Nomadic (II) Fact File</a></li>
        <li><a href="https://www.titanicbelfast.com/explore/ss-nomadic/explore-her-history/" target="_blank" rel="noopener">Titanic Belfast — Explore Her History</a></li>
        <li><a href="https://www.titanicbelfast.com/explore/ss-nomadic/the-restoration/" target="_blank" rel="noopener">Titanic Belfast — The Restoration</a></li>
      </ul>`);

          replaceRange(
            'ships/ss-traffic.html',
            '<h2>Overview</h2>',
            '<span class="mini-badge">Evidence-first ship guide</span>',
`<h2>Overview</h2>
      <p>
        SS <em>Traffic</em> was the smaller of White Star Line’s two purpose-built Cherbourg tenders, constructed by Harland &amp; Wolff alongside <a href="/ships/ss-nomadic">SS <em>Nomadic</em></a>. She was intended primarily for third-class passengers, baggage, mail, and cargo, while <em>Nomadic</em> handled first- and second-class passengers.
      </p>
      <p>
        That division of labor made <em>Traffic</em> part of the operating system created for the Olympic-class liners. Cherbourg’s facilities could not berth the largest transatlantic ships directly, so passengers and baggage had to be moved between shore and liner by tender. <em>Traffic</em> performed the less glamorous but indispensable half of that work.
      </p>

      <h2>Key Facts</h2>
      <div class="facts">
        <div class="fact-row"><div class="fact-label">Operator (as built)</div><div class="fact-value">White Star Line</div></div>
        <div class="fact-row"><div class="fact-label">Builder</div><div class="fact-value">Harland &amp; Wolff, Belfast</div></div>
        <div class="fact-row"><div class="fact-label">Yard Number</div><div class="fact-value">423</div></div>
        <div class="fact-row"><div class="fact-label">Construction Began</div><div class="fact-value">22 December 1910</div></div>
        <div class="fact-row"><div class="fact-label">Launched</div><div class="fact-value">27 April 1911</div></div>
        <div class="fact-row"><div class="fact-label">Type</div><div class="fact-value">Passenger, baggage, mail, and cargo tender</div></div>
        <div class="fact-row"><div class="fact-label">Station</div><div class="fact-value">Cherbourg, France</div></div>
        <div class="fact-row"><div class="fact-label">Working Pair</div><div class="fact-value">SS <em>Nomadic</em></div></div>
        <div class="fact-row"><div class="fact-label">Later Name</div><div class="fact-value"><em>Ingénieur Riebell</em></div></div>
        <div class="fact-row"><div class="fact-label">Fate</div><div class="fact-value">Sunk in wartime service, 17 January 1941</div></div>
      </div>

      <h2>Design &amp; Operational Role</h2>
      <p>
        The distinction between <em>Traffic</em> and <em>Nomadic</em> was functional as well as social. Titanic Belfast’s documentation describes <em>Traffic</em> as the tender for third-class passengers, cargo, and baggage, including special baggage-handling equipment intended to speed turnaround. This was a practical response to the enormous volumes generated by the new Olympic-class service.
      </p>
      <p>
        Seen in that light, <em>Traffic</em> is evidence of how thoroughly class separation extended through the travel system. The passenger’s category shaped not only accommodation aboard the liner but the vessel used to reach it. That is an important corrective to histories that treat embarkation as a single undifferentiated event.
      </p>

      <h2>Early Service at Cherbourg</h2>
      <p>
        <em>Traffic</em> and <em>Nomadic</em> were built together at Belfast and entered the Cherbourg service in 1911. Specialist White Star research records that the two tenders departed Belfast with <em>Olympic</em> on 31 May 1911 and reached Cherbourg on 3 June. From there they became routine components of White Star’s calls at the French port.
      </p>
      <p>
        Her work was repetitive by design: move passengers and baggage efficiently, meet the liner’s timetable, and disappear again into the harbor system. That lack of glamour is precisely why surviving documentation matters. <em>Traffic</em> helps reconstruct the labor and logistics that made a major liner call possible.
      </p>

      <h2>Later Career and Wartime Loss</h2>
      <p>
        In 1934, after harbor improvements reduced the need for the original tender arrangement, <em>Traffic</em> was sold with <em>Nomadic</em> to a French harbor-services concern and renamed <em>Ingénieur Riebell</em>. She remained a working vessel rather than passing immediately into retirement.
      </p>
      <p>
        Her Second World War history was far less fortunate. Specialist accounts record that she was scuttled by the French in June 1940 as German forces approached Cherbourg, subsequently raised by the Germans, and employed in wartime service. On 17 January 1941 she was sunk in the English Channel by a British torpedo. This corrects the sometimes-repeated claim that her final loss resulted from a collision.
      </p>

      <h2>Why Traffic Matters</h2>
      <p>
        <em>Traffic</em> is a useful counterweight to flagship-centered ocean-liner history. Her significance lies in function: she moved the people, luggage, mail, and cargo that allowed the great ships to keep their schedules. Without vessels like her, the celebrated scale of <em>Olympic</em> and <em>Titanic</em> would have been operationally awkward at ports such as Cherbourg.
      </p>
      <p>
        The contrast with preserved <em>Nomadic</em> is also instructive. One tender survives as a museum ship; the other disappeared in wartime. Together they show both the richness and the fragility of the supporting infrastructure around the transatlantic liner system.
      </p>

      <h2>Collecting &amp; Attribution Notes</h2>
      <p>
        <em>Traffic</em>-specific material is uncommon. Generic White Star or Cherbourg material should not be upgraded to a vessel attribution without evidence. Stronger identifications use the ship’s name, documented tender assignments, photographs, builder records, or a traceable provenance rather than branding alone.
      </p>`
          );

          replaceSources('ships/ss-traffic.html', `<h2>Sources (Selected)</h2>
      <ul class="sources">
        <li><a href="/sources">Ocean Liner Curator — Master Sources</a></li>
        <li><a href="https://www.titanicbelfast.com/history-of-titanic/ship-fact-files/nomadic-ii-fact-file/" target="_blank" rel="noopener">Titanic Belfast — Nomadic (II) Fact File (Traffic relationship and role)</a></li>
        <li><a href="https://www.whitestarhistory.com/traffic2" target="_blank" rel="noopener">White Star History — SS Traffic (II) (specialist chronology; cross-check where possible)</a></li>
      </ul>`);

          replaceRange(
            'ships/rms-lucania.html',
            '<h2>Overview</h2>',
            '<span class="mini-badge">Evidence-first ship guide</span>',
`<h2>Overview</h2>
<p>
RMS <em>Lucania</em> was one of Cunard Line’s two great express sisters of the early 1890s, paired with <a href="/ships/rms-campania">RMS <em>Campania</em></a>. Built by Fairfield Shipbuilding &amp; Engineering Co. at Govan, she entered service in September 1893 and represented the mature peak of high-powered reciprocating steam propulsion before the turbine era.
</p>
<p>
The two sisters combined speed, scale, and elaborate Victorian interiors in a way that restored Cunard’s position in the North Atlantic express trade. <em>Lucania</em> soon became a record-setting liner and remained one of the best-known British passenger ships of the 1890s.
</p>

<h2>Key Facts</h2>
<div class="facts">
  <div class="fact-row"><div class="fact-label">Operator</div><div class="fact-value">Cunard Line</div></div>
  <div class="fact-row"><div class="fact-label">Builder</div><div class="fact-value">Fairfield Shipbuilding &amp; Engineering Co., Govan, Scotland</div></div>
  <div class="fact-row"><div class="fact-label">Sister Ship</div><div class="fact-value">RMS <em>Campania</em></div></div>
  <div class="fact-row"><div class="fact-label">Launched</div><div class="fact-value">2 February 1893</div></div>
  <div class="fact-row"><div class="fact-label">Maiden Voyage</div><div class="fact-value">2 September 1893</div></div>
  <div class="fact-row"><div class="fact-label">Tonnage</div><div class="fact-value">about 12,950 GRT</div></div>
  <div class="fact-row"><div class="fact-label">Length</div><div class="fact-value">about 620 ft overall</div></div>
  <div class="fact-row"><div class="fact-label">Propulsion</div><div class="fact-value">Twin-screw; five-cylinder triple-expansion engines</div></div>
  <div class="fact-row"><div class="fact-label">Service Speed</div><div class="fact-value">about 22 knots</div></div>
  <div class="fact-row"><div class="fact-label">Notability</div><div class="fact-value">Atlantic speed-record / Blue Riband holder in the 1890s</div></div>
  <div class="fact-row"><div class="fact-label">Fate</div><div class="fact-value">Severely damaged by fire at Liverpool, 14 August 1909; subsequently broken up</div></div>
</div>

<h2>Design at the Peak of Reciprocating Steam</h2>
<p>
<em>Lucania</em> and <em>Campania</em> were conceived as a paired answer to the escalating contest for North Atlantic speed and prestige. Their enormous reciprocating engines represented the culmination of a technology that had been refined for decades. Within little more than a decade, steam turbines would begin to displace machinery of this type in the fastest new liners, making the sisters both technological triumphs and markers of an approaching transition.
</p>
<p>
Royal Museums Greenwich preserves technical drawings for the pair, reinforcing how closely they were conceived together. Their significance therefore lies not only in individual records but in the two-ship system Cunard created: sister flagships able to sustain a fast, regular express schedule rather than relying on a single spectacular vessel.
</p>

<h2>Passenger Spaces and Victorian Identity</h2>
<p>
The interiors were central to the ships’ reputation. Royal Museums Greenwich documents <em>Lucania</em>’s first-class dining saloon as an Italianate space with a white-and-gold coffered ceiling, Ionic columns, and Cunard’s rampant-lion insignia on swivel chairs bolted to the deck. The room captures the late-Victorian idea of a liner as both machine and social environment: industrial power below, architectural display above.
</p>
<p>
That combination matters because later liners are often remembered through increasingly theatrical interiors. <em>Lucania</em> belongs to an earlier phase in which the passenger saloon still drew strongly on nineteenth-century club, hotel, and domestic design vocabularies even while the ship itself represented some of the most advanced marine engineering of its day.
</p>

<h2>Record Service and Competition</h2>
<p>
After her September 1893 maiden voyage, <em>Lucania</em> quickly established herself among the fastest liners afloat. Contemporary reporting and later summaries associate her with the Blue Riband and Atlantic speed records through much of the 1890s. Her achievements should be understood alongside those of <em>Campania</em>: the sisters traded prestige with one another and faced growing pressure from German express liners later in the decade.
</p>
<p>
The record story is important, but it can obscure the commercial purpose behind it. Speed shortened the crossing, improved schedule reliability, generated publicity, and advertised the technical credibility of both Cunard and British shipbuilding. A record passage was therefore simultaneously an engineering result, a marketing instrument, and a national prestige event.
</p>

<h2>Final Years</h2>
<p>
By the early twentieth century <em>Lucania</em> was no longer the newest expression of Cunard technology, but she remained a major vessel with a well-established identity. In August 1909, while at Liverpool, she was badly damaged by fire. The loss ended a career that had spanned the transition from the great reciprocating express liners of the 1890s toward the turbine-powered generation represented by <em>Lusitania</em> and <em>Mauretania</em>.
</p>

<h2>Why Lucania Matters</h2>
<p>
<em>Lucania</em> is a hinge ship in Cunard history. She represents the point at which reciprocating steam, Victorian interior design, and the prestige of Atlantic speed reached a mature form just before a new technological generation displaced it. Her story also makes more sense as part of a sister-ship partnership with <em>Campania</em> than as a sequence of isolated record crossings.
</p>
<p>
For attribution work, the closeness of the two sisters requires caution. Photographs and ephemera should be dated and cross-checked carefully; material simply labeled “Cunard express steamer” cannot always be assigned confidently to one ship or the other.
</p>`
          );

          replaceSources('ships/rms-lucania.html', `<h2>Sources (Selected)</h2>
<ul class="sources">
  <li><a href="/sources">Ocean Liner Curator — Sources</a></li>
  <li><a href="https://www.rmg.co.uk/collections/objects/rmgc-object-539263" target="_blank" rel="noopener">Royal Museums Greenwich — Campania (1893); Lucania (1893), technical drawing</a></li>
  <li><a href="https://www.rmg.co.uk/collections/objects/rmgc-object-20251" target="_blank" rel="noopener">Royal Museums Greenwich — First Class Dining Saloon on the Lucania</a></li>
  <li><a href="https://catalogs.marinersmuseum.org/object/ARF11790" target="_blank" rel="noopener">The Mariners’ Museum — Cunard Line Campania/Lucania deck plans</a></li>
  <li><a href="https://catalogs.marinersmuseum.org/search?searchable-actors-keyword=Lucania+%28Screw+schooner+%3A+1893%29." target="_blank" rel="noopener">The Mariners’ Museum — Lucania archival holdings</a></li>
</ul>`);

          replaceRange(
            'ships/ss-city-of-new-york-1888.html',
            '<h2>Overview</h2>',
            '<span class="mini-badge">Evidence-first ship guide</span>',
`<h2>Overview</h2>
      <p>
        SS <em>City of New York</em> (1888) was one of the defining express liners of the late Inman Line and, after 1893, became the American-flagged SS <em>New York</em>. Built by J. &amp; G. Thomson at Clydebank, she and <a href="/ships/ss-city-of-paris">SS <em>City of Paris</em></a> formed a closely related pair intended to compete directly in the North Atlantic speed trade.
      </p>
      <p>
        Her career is especially useful because it crosses corporate, national, and military identities. The same hull served as an Inman express liner, an American Line flagship, USS <em>Harvard</em> during the Spanish–American War, and USS <em>Plattsburg</em> during the First World War.
      </p>
      <p class="note">For cataloging precision, the year 1888 is useful whenever the full name <em>City of New York</em> is used; several unrelated vessels carried similar names.</p>

      <h2>Key Facts</h2>
      <div class="facts" role="table" aria-label="Key facts table">
        <div class="fact-row"><div class="fact-label">Original Operator</div><div class="fact-value">Inman &amp; International Steamship Co.</div></div>
        <div class="fact-row"><div class="fact-label">Later Operator</div><div class="fact-value">American Line</div></div>
        <div class="fact-row"><div class="fact-label">Builder</div><div class="fact-value">J. &amp; G. Thomson, Clydebank, Scotland</div></div>
        <div class="fact-row"><div class="fact-label">Launched</div><div class="fact-value">15 March 1888</div></div>
        <div class="fact-row"><div class="fact-label">Maiden Voyage</div><div class="fact-value">1 August 1888, Liverpool–New York</div></div>
        <div class="fact-row"><div class="fact-label">Gross Tonnage</div><div class="fact-value">about 10,499 GRT as built</div></div>
        <div class="fact-row"><div class="fact-label">Length</div><div class="fact-value">about 528 ft between perpendiculars; about 560 ft overall</div></div>
        <div class="fact-row"><div class="fact-label">Propulsion</div><div class="fact-value">Twin-screw triple-expansion steam engines</div></div>
        <div class="fact-row"><div class="fact-label">Speed</div><div class="fact-value">about 20 knots</div></div>
        <div class="fact-row"><div class="fact-label">Atlantic Record</div><div class="fact-value">Eastbound Blue Riband / record passage, 1892</div></div>
        <div class="fact-row"><div class="fact-label">Renamed</div><div class="fact-value">SS <em>New York</em>, 1893</div></div>
        <div class="fact-row"><div class="fact-label">Naval Identities</div><div class="fact-value">USS <em>Harvard</em> (1898); USS <em>Plattsburg</em> (World War I)</div></div>
        <div class="fact-row"><div class="fact-label">Fate</div><div class="fact-value">Sold out of American service and broken up in Italy, 1923</div></div>
      </div>

      <h2>Design and the Twin-Screw Transition</h2>
      <p>
        <em>City of New York</em> belonged to the generation in which twin screws became a major advantage for express liners. Two independent propellers offered both greater power and a degree of redundancy compared with a single-screw arrangement. The Mariners’ Museum records two three-cylinder triple-expansion engines developing roughly 18,500 indicated horsepower in the ship’s original configuration.
      </p>
      <p>
        Her dimensions also illustrate how measurement conventions can create apparent contradictions in secondary sources. The Mariners’ Museum gives about 525 feet in one catalog record, while period-derived compilations distinguish roughly 528 feet between perpendiculars from about 560 feet overall. For collection records, stating the measurement basis is better than treating one figure as universally definitive.
      </p>

      <h2>Inman Line Express Service</h2>
      <p>
        <em>City of New York</em> began her maiden voyage from Liverpool on 1 August 1888. Together with <em>City of Paris</em>, she gave Inman a modern paired express service capable of challenging Cunard and White Star. In 1892 she secured the eastbound Atlantic record, an achievement frequently compressed in later retellings into the generic phrase “Blue Riband holder.” The direction matters: speed records were tracked separately eastbound and westbound.
      </p>
      <p>
        The ships were also products of an increasingly international business environment. They were British-built and initially British-registered, yet American capital was central to the enterprise. That tension between construction, ownership, flag, and route became one of the defining features of the liner business in the decades that followed.
      </p>

      <h2>American Flag and Refit</h2>
      <p>
        In 1893 the ship transferred to American registry and became simply <em>New York</em>. The change was more than cosmetic: it made one of the best-known Atlantic liners a visible American-flag presence in a trade dominated by European tonnage. The Mariners’ Museum notes that a major refit beginning in 1901 replaced machinery and ultimately altered the vessel’s external appearance from three funnels to two before she returned to service in 1903.
      </p>

      <h2>Military Service and Long Career</h2>
      <p>
        In 1898, during the Spanish–American War, the liner served the United States Navy as USS <em>Harvard</em>. She later returned to commercial service, only to be taken up again during the First World War as USS <em>Plattsburg</em>. Those changes make attribution particularly sensitive: an object associated with <em>Harvard</em> or <em>Plattsburg</em> belongs to a different operational phase from Inman or American Line passenger material even though the underlying ship was the same.
      </p>
      <p>
        After more than three decades of changing service, she left the major Atlantic trade and was eventually broken up in Italy in 1923. Her longevity is striking for a vessel designed during the high-speed competition of the 1880s.
      </p>

      <h2>Why City of New York Matters</h2>
      <p>
        The ship sits at the intersection of several important liner stories: the adoption of twin-screw propulsion, the last major phase of Inman Line competition, the rise of American financial control in transatlantic shipping, and the use of large passenger liners as naval auxiliaries. Few ships illustrate the permeability between corporate and national identities quite as clearly.
      </p>
      <p>
