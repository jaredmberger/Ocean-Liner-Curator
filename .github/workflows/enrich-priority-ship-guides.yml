`<h2>Overview</h2>
      <p>
        SS <em>Rotterdam</em> (1908) was Holland America Line’s flagship in the years before the First World War and one of the most important Dutch transatlantic liners of her generation. Built by Harland &amp; Wolff in Belfast, she entered service in June 1908 on the Rotterdam–New York route.
      </p>
      <p>
        Her importance rested less on headline speed than on scale, accommodation, and route identity. Holland America’s own historical timeline identifies <em>Rotterdam</em> as the company flagship and notes a notable design feature: she was the line’s first transatlantic ship with a glass-enclosed promenade.
      </p>

      <h2>Key Facts</h2>
      <div class="facts" role="table" aria-label="Key facts table">
        <div class="fact-row"><div class="fact-label">Operator</div><div class="fact-value">Holland America Line (NASM)</div></div>
        <div class="fact-row"><div class="fact-label">Builder</div><div class="fact-value">Harland &amp; Wolff, Belfast</div></div>
        <div class="fact-row"><div class="fact-label">Laid Down</div><div class="fact-value">6 November 1906</div></div>
        <div class="fact-row"><div class="fact-label">Launched</div><div class="fact-value">3 March 1908</div></div>
        <div class="fact-row"><div class="fact-label">Completed</div><div class="fact-value">6 June 1908</div></div>
        <div class="fact-row"><div class="fact-label">Maiden Voyage</div><div class="fact-value">13 June 1908</div></div>
        <div class="fact-row"><div class="fact-label">Route</div><div class="fact-value">Rotterdam–New York / Hoboken</div></div>
        <div class="fact-row"><div class="fact-label">Tonnage</div><div class="fact-value">about 24,000 GRT</div></div>
        <div class="fact-row"><div class="fact-label">Length</div><div class="fact-value">about 668 ft overall</div></div>
        <div class="fact-row"><div class="fact-label">Propulsion</div><div class="fact-value">Twin-screw; quadruple-expansion steam engines</div></div>
        <div class="fact-row"><div class="fact-label">Service Speed</div><div class="fact-value">about 16–17 knots</div></div>
        <div class="fact-row"><div class="fact-label">Notable Feature</div><div class="fact-value">Glass-enclosed promenade</div></div>
        <div class="fact-row"><div class="fact-label">Fate</div><div class="fact-value">Withdrawn at the beginning of the Second World War; broken up in 1940</div></div>
      </div>

      <h2>A Different Model of Prestige</h2>
      <p>
        <em>Rotterdam</em> belonged to the same broad era as the fastest British and German express liners, yet Holland America did not build her primarily as a record breaker. Her roughly 16–17-knot service speed supported a different proposition: dependable transportation, substantial passenger capacity, and a distinctly Dutch presence on the North Atlantic.
      </p>
      <p>
        That difference is historically useful. Liner competition is often narrated as a sequence of Blue Riband contests, but most passengers did not choose solely on speed. Schedule, price, migration networks, reputation, and accommodation mattered enormously. <em>Rotterdam</em> demonstrates how a line could establish prestige without chasing the fastest crossing.
      </p>

      <h2>Passenger Experience and the Enclosed Promenade</h2>
      <p>
        Holland America’s anniversary history singles out <em>Rotterdam</em> as the company’s first transatlantic vessel with a glass-enclosed promenade. On the North Atlantic, where wind, spray, and cold could make open deck space uncomfortable, enclosure extended the usefulness of the promenade and turned it into a more dependable passenger amenity.
      </p>
      <p>
        The feature also fits the broader direction of Edwardian liner design: public spaces were becoming more numerous, more specialized, and more deliberately insulated from the working realities of the ship. Comfort increasingly meant controlling the passenger’s environment, not merely providing a berth and dining room.
      </p>

      <h2>Migration and the Holland America System</h2>
      <p>
        The Rotterdam City Archives emphasizes Holland America Line’s major role in European migration to the United States. That context matters for this ship. <em>Rotterdam</em> was not simply a floating hotel for affluent travelers; she operated within a company whose traffic included emigrants, tourists, business travelers, and returning families moving through Rotterdam’s port infrastructure toward New York.
      </p>
      <p>
        The surviving Holland America headquarters and migration records in Rotterdam reinforce the shore-side half of that story. As with other major liner companies, the vessel was only one component of a larger system of ticketing, rail travel, baggage handling, medical inspection, lodging, and port administration.
      </p>

      <h2>War, Adaptation, and Interwar Service</h2>
      <p>
        The First World War disrupted normal North Atlantic operations even for neutral Dutch shipping. <em>Rotterdam</em> survived that period and continued into the interwar years, when changing immigration policy and passenger demand encouraged established liners to adapt their accommodation and itineraries. Cruising became increasingly important across the industry as operators sought new uses for large passenger ships outside traditional point-to-point migration traffic.
      </p>
      <p>
        By the late 1930s the ship belonged to an earlier generation of liner design. The outbreak of the Second World War brought her career to an end, and she was broken up in 1940.
      </p>

      <h2>Why Rotterdam Matters</h2>
      <p>
        <em>Rotterdam</em> offers a valuable alternative to a speed-centered account of ocean-liner history. She represents a successful route-focused flagship: large, recognizable, commercially useful, and closely tied to the migration history of her home port. Her glass-enclosed promenade and long career also show how passenger comfort and operational durability could matter as much as maximum speed.
      </p>
      <p>
        For attribution, the ship’s name requires special care because “Rotterdam” may refer to the vessel, the city, the departure port, or the company’s headquarters. Strong cataloging should identify which meaning is actually supported by the object or document.
      </p>`
