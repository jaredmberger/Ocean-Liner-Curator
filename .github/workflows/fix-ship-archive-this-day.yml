name: Fix Ship Archive This Day loader

on:
  push:
    paths:
      - '.github/workflows/fix-ship-archive-this-day.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add chronology additions loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ships/ships.html')
          text = path.read_text()
          base = '<script src="/assets/this-day-ocean-liners.js?v=2"></script>'
          additions = '<script src="/assets/this-day-ocean-liners-additions.js?v=3"></script>'

          if additions not in text:
              if base not in text:
                  raise SystemExit('Base chronology loader not found')
              text = text.replace(base, base + '\n' + additions, 1)
              path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- ships/ships.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ships/ships.html
          git commit -m "Fix Ship Archive Today in Ocean Liner History data"
          git push
