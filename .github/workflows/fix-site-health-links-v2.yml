name: Apply site health link repairs
on:
  push:
    branches: [fix/site-health-broken-links-2026-08-03]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repairs
        shell: python
        run: |
          import ast, html, sys
          from pathlib import Path
          from urllib.parse import urlparse

          wf = Path('.github/workflows/fix-site-health-links.yml').read_text('utf-8')
          row_line = next(line.strip() for line in wf.splitlines() if line.strip().startswith('rows='))
          rows = ast.literal_eval(row_line[5:])

          def variants(u):
              return list(dict.fromkeys([u, html.escape(u, quote=False)]))

          def unwrap_anchor(text, old):
              total = 0
              for ov in variants(old):
                  for quote in ('"', "'"):
                      needle = 'href=' + quote + ov + quote
                      while True:
                          h = text.find(needle)
                          if h < 0:
                              break
                          a0 = text.rfind('<a', 0, h)
                          a1 = text.find('>', h)
                          z0 = text.find('</a>', a1)
                          if a0 < 0 or a1 < 0 or z0 < 0:
                              break
                          inner = text[a1 + 1:z0]
                          text = text[:a0] + inner + text[z0 + 4:]
                          total += 1
              return text, total

          changed = set()
          failed = []
          for page, old, new in rows:
              p = urlparse(page).path.strip('/')
              candidates = [Path(p + '.html') if p else Path('index.html')]
              candidates += [Path(p) / 'index.html'] if p else []
              candidates = [x for x in candidates if x.exists()]
              if not candidates:
                  candidates = []
                  for x in Path('.').rglob('*.html'):
                      s = x.read_text('utf-8', errors='ignore')
                      if page in s and any(v in s for v in variants(old)):
                          candidates.append(x)
              applied = 0
              for x in candidates:
                  s = x.read_text('utf-8')
                  original = s
                  if new:
                      for ov in variants(old):
                          for q in ('"', "'"):
                              needle = 'href=' + q + ov + q
                              repl = 'href=' + q + new + q
                              n = s.count(needle)
                              if n:
                                  s = s.replace(needle, repl)
                                  applied += n
                  else:
                      s, n = unwrap_anchor(s, old)
                      applied += n
                  if s != original:
                      x.write_text(s, 'utf-8')
                      changed.add(str(x))
              if applied == 0 and 'this-day-in-ocean-liner-history' not in page:
                  failed.append((page, old))

          special = Path('this-day-in-ocean-liner-history.html')
          if special.exists():
              s = special.read_text('utf-8')
              o = s
              s = s.replace("https://oceanliners.net/'%20+%20escapeHTML(event.relatedUrl)%20+%20'", "' + escapeHTML(event.relatedUrl) + '")
              if s != o:
                  special.write_text(s, 'utf-8')
                  changed.add(str(special))

          print('Changed files:', len(changed))
          print('Failed rows:', len(failed))
          if failed:
              for item in failed:
                  print(item)
              sys.exit(2)
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix broken links from 2026-08-03 site health report"
          git push
